name: Update ASCII stats

on:
  schedule: # every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
    - main
    paths-ignore:
    - README.md

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render ASCII stats into README
        run: |
          pip install pyfiglet
          python .github/scripts/ascii_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update ASCII stats"
          git push
